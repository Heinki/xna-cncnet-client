; Copy to the active/base Resources directory as ConquestBattle.ini.
; This is a mod-author integration file, not player battle settings.
; [Conquest] is configuration only and is never copied into the generated map.
;
; Defaults: TS/YR/Ares use isolated native handicap profiles with the five stats.
; TD/RA/D2K have no combat-stat adapter by default. Declare only stats your game
; actually supports. A custom adapter must consume the stat placeholders below.
;
; [Conquest]
; NativeProfiles=yes
; SupportedStats=Health,Armor,Speed,AttackSpeed,Damage
; RulesFile=INI/Rules.ini
;
; RulesFile is optional for native profiles. Use an effective, flattened source
; inside this installation when engine rules are packed or custom-named.
; Cloning is NEVER automatic. Only enable it for a validated mod/roster:
;
; EnableUnitClones=yes
; CloneTypes=E1,MTNK
; ProductionHouseIndex=6
;
; CloneTypes must list existing mobile IDs from that mod's effective RulesFile.
; TS: requires Vinifera ownership masks and a registered, unused house index
; from 6 through 30. Do not reserve a mask used by either opponent.
; YR/Ares: uses a private player country and native ownership restrictions.
; Only listed units and deployment forms receive clone stats. Shared unlisted
; types, starting native units, delivery systems and infrastructure are not
; rewritten. Validate these paths before enabling this adapter for a game pack.
; NativeProfiles is the fallback; cloning and profiles do not stack.
;
; Numeric substitutions in non-[Conquest] sections:
; {PlayerPower}, {AIPower}        committed autobattle ratings
; {PlayerMultiplier}, {AIMultiplier}  1 + that faction's Damage bonus / 100
; {PlayerHealth}, {AIHealth}      committed bonus percentages, e.g. 20 for +20%
; {PlayerArmor}, {AIArmor}
; {PlayerSpeed}, {AISpeed}
; {PlayerAttackSpeed}, {AIAttackSpeed}
; {PlayerDamage}, {AIDamage}      includes any consumed supply
;
; The human occupies Multi1; the sole AI occupies Multi2. Map house names and
; effect keys depend on the engine. Use only rules/triggers your mod implements.
;
; [MyModConquestRules]
; HumanDamageBonus={PlayerDamage}
; ComputerDamageBonus={AIDamage}
;
; Comment-only files intentionally do not alter the default configuration.

; Permanent node rewards
; Recruitment training (+1 strength per recruit/level) and war treasury
; (+25 credits per turn/level) are available to every game, with 3 levels each.
; YR/Ares additionally offer veteran production when isolated cloning is enabled
; and the explicit roster includes trainable mobile units. Only that roster gets
; veteran production; same-faction opponents keep their own country lists.
;
; Starting troops/defenses require real game-pack adapters. They are not enabled
; by inventing unit IDs or assuming the same map scripting API across games.
; Uncomment and adapt a definition only after its rule file exists and works
; with the campaign map pool and chosen factions:
;
; [ConquestPerk:starting-garrison]
; Kind=StartingTroops
; Games=TS
; Name=Starting garrison
; Description=Three faction-native troops at the start of every battle.
; MaximumLevel=1
; PurchaseCost=500
; AutoCombatStrength=2
; MapCode=Resources/Conquest/StartingGarrison.ini
;
; [ConquestPerk:base-defense]
; Kind=StartingDefenses
; Games=YR,Ares
; Name=Starting defenses
; Description=A faction-native defensive emplacement at battle start.
; MaximumLevel=1
; PurchaseCost=500
; TerritoryOnly=yes
; AutoCombatStrength=3
; MapCode=Resources/Conquest/BaseDefense.ini
;
; Optional SpawnCode=... applies a separate adapter to spawn.ini.
; Paths are relative to this installation and must exist before campaign creation.
; Games is an explicit list of ClientGameType values. Optional Sides=0,1 limits
; a reward to those internal country indices; both campaign factions must be
; compatible. Unsupported definitions
; are omitted from node generation. Name/Description are game-pack display text.
; AutoCombatStrength is the equivalent army-strength bonus per collected level;
; StartingDefenses contributes only while defending in autobattle.
;
; Adapter placeholders:
; {PlayerLevel}, {AILevel}                committed reward levels (0 if unowned)
; {PlayerStartWaypoint}, {AIStartWaypoint} resolved map start indices (map only)
; {PlayerUnit:UNIT_ID}                    player clone ID, or native ID when
;                                        cloning is off (map adapters only).
; Use this marker for player starting troops so a same-faction enemy keeps
; its own native copy. The template still explicitly chooses UNIT_ID.
;
; Prefix a template section with Player: or AI: to apply it only when that side
; owns this perk. The prefix is stripped from the generated section name.
; For example [Player:MyModStartingTroops] writes [MyModStartingTroops] only
; for an entitled player, substituting {PlayerLevel} and {PlayerStartWaypoint}.
; Unprefixed sections run if either side owns the reward. Use unique keys/IDs
; to preserve existing map objects and scripts. Spawn adapters cannot assume
; starting-waypoint placeholders are available before map preparation.
;
; Reward levels are snapshotted when an attack begins. Retrying that battle
; reuses its committed inventory. Re-capturing a node never grants its reward
; twice to the same faction; collected rewards survive losing the node.
;
; Shop and node improvements:
; PurchaseCost defaults to 500; 0 makes a perk capture-only.
; TerritoryOnly defaults to yes for configured StartingDefenses, no otherwise.
; Only StartingDefenses can be territory-only. These perks are built on the
; inspected owned node, not added to the permanent faction inventory. Some new
; nodes begin with them, including neutral nodes. They apply only when that node
; is attacked and pass to its captor. Existing saved definitions retain their scope.
; Faction-wide StartingDefenses also apply only while defending.
;
; Base-relative map placeholders (TS/YR CnCNet map coordinate format):
; {PlayerSpawn}, {AISpawn}                 SpawnN owner for the resolved waypoint
; {PlayerStartX:4}, {PlayerStartY:-4}      waypoint coordinates plus cell offsets
; {AIStartX:4}, {AIStartY:-4}
; {PlayerStartCell:4:-4}, {AIStartCell:4:-4} packed y*1000+x cell
; Conquest assigns distinct client-selected starts before preparing these maps.
; These substitutions do not validate terrain, building footprints, power, or
; clearance around the MCV. The game pack must validate its supported map pool.
;
; Faction-specific sections:
; [Player@0:Units] applies only when the human owns this perk AND uses internal
; side/country index 0. [AI@1:Structures] similarly selects AI country 1.
; Existing [Player:...] / [AI:...] sections still apply to any eligible faction.
; Choose unique object keys so different perks and existing maps do not collide.
; See ConquestStartingForces.md for TS/YR integration and starting veterancy.
