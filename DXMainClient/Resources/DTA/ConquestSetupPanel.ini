[INISystem]
BasedOn=GenericWindow.ini

[ConquestSetupPanel]
BackgroundTexture=MainMenu/dbak.png
DrawMode=Centered
DrawBorders=false

; GenericWindow.ini provides the lobby's native [$ExtraControls] border.

[ddCampaignSize]
$X=((getWidth($ParentControl) - 460) / 2) + 200

[ddStartingCredits]
$X=getX(ddCampaignSize)

[ddDifficulty]
$X=getX(ddCampaignSize)

[tbSeed]
$X=getX(ddCampaignSize)

[ddBonusDensity]
$X=getX(ddCampaignSize)

[ddPlayerFaction]
$X=getX(ddCampaignSize)

[ddAIFaction]
$X=getX(ddCampaignSize)

[btnNewCampaign]
$Y=getHeight($ParentControl) - 48

[btnContinue]
$X=(getWidth($ParentControl) - getWidth($Self)) / 2
$Y=getY(btnNewCampaign)

[btnMainMenu]
$X=getWidth($ParentControl) - getWidth($Self) - 24
$Y=getY(btnNewCampaign)
